<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="frame">
  <div>
    <div class="eyebrow">{{EYEBROW}}</div>
    <h1 class="title small">{{TITLE}}</h1>
    <div class="bars">
      <div class="bar-col"><div class="bar-value">{{V1}}</div><div class="bar" style="height:{{H1}}%;"></div><div class="bar-label">{{L1}}</div></div>
      <div class="bar-col"><div class="bar-value">{{V2}}</div><div class="bar" style="height:{{H2}}%;"></div><div class="bar-label">{{L2}}</div></div>
      <div class="bar-col"><div class="bar-value">{{V3}}</div><div class="bar" style="height:{{H3}}%;"></div><div class="bar-label">{{L3}}</div></div>
      <div class="bar-col"><div class="bar-value">{{V4}}</div><div class="bar" style="height:{{H4}}%;"></div><div class="bar-label">{{L4}}</div></div>
    </div>
  </div>
  <div class="footer">
    <div class="logo">Py<span>Fsa</span></div>
    <div class="tag">pyfsasoftware.com.ar</div>
  </div>
</div>
</body>
</html>
