<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="frame">
  <div>
    <div class="eyebrow">{{EYEBROW}}</div>
    <h1 class="title small">{{TITLE}}</h1>
  </div>
  <div class="split">
    <div class="panel-half {{LEFT_CLASS}}">
      <h4>{{LEFT_LABEL}}</h4>
      <ul>
        <li>{{LEFT_1}}</li>
        <li>{{LEFT_2}}</li>
        <li>{{LEFT_3}}</li>
      </ul>
    </div>
    <div class="panel-half {{RIGHT_CLASS}}">
      <h4>{{RIGHT_LABEL}}</h4>
      <ul>
        <li>{{RIGHT_1}}</li>
        <li>{{RIGHT_2}}</li>
        <li>{{RIGHT_3}}</li>
      </ul>
    </div>
  </div>
  <div class="footer">
    <div class="logo">Py<span>Fsa</span></div>
    <div class="tag">pyfsasoftware.com.ar</div>
  </div>
</div>
</body>
</html>
