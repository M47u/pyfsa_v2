<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1000px;
    height: 1000px;
    background: {{BG}};
  }
  .wrap {
    width: 1000px;
    height: 1000px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: {{SIZE}}px;
    letter-spacing: .01em;
    color: #f0f0eb;
    line-height: 1;
  }
  .logo span { color: #c5f135; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Py<span>Fsa</span></div>
</div>
</body>
</html>
